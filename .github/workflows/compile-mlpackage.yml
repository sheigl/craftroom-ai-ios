# COMPILE-ONLY spike (T2 device-v2): compile a .mlpackage -> .mlmodelc on the
# macOS runner. Never touches the device-v1 payload, build.yml, or testflight.yml.
# Input: a release asset URL for the .zip of the .mlpackage produced on Linux.
name: compile-mlpackage

on:
  workflow_dispatch:
    inputs:
      pkg_zip_url:
        description: >-
          URL(s) of the .zip containing the .mlpackage. Space-separated: parts are
          concatenated in order (a single URL is just one part). The .zip must have
          the .mlpackage folder at its top level.
        required: true
      pkg_name:
        description: Package folder name inside the zip (e.g. Unet_ControlNet_canny1200_6bit.mlpackage)
        required: true
        default: Unet_ControlNet_canny1200_6bit.mlpackage

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PKG: ${{ inputs.pkg_name }}
    steps:
      - name: Runner inventory
        run: |
          sw_vers
          xcrun --sdk macosx --show-sdk-version
          df -h /
      - name: Download package
        run: |
          set -euo pipefail
          rm -f pkg.zip
          i=0
          for url in ${{ inputs.pkg_zip_url }}; do
            echo "part $i <- $url"
            curl -L --retry 3 --retry-delay 5 --fail -o "part-$i.bin" "$url"
            cat "part-$i.bin" >> pkg.zip
            rm -f "part-$i.bin"
            i=$((i+1))
          done
          ls -l pkg.zip
          unzip -q pkg.zip
          # Free the archive immediately: the fp16 package (7.6 GB zip + 7.6 GB
          # tree + 7.6 GB output) does not fit a runner disk all at once.
          rm -f pkg.zip
          ls -d "$PKG"
          du -sh "$PKG"
          echo "--- package identity (must match the Linux build) ---"
          shasum -a 256 "$PKG/Data/com.apple.CoreML/weights/weight.bin" || true
          df -h /
      - name: Inspect package I/O
        run: |
          plutil -p "$PKG/Manifest.json" || true
          cat "$PKG/Data/com.apple.CoreML/model.mlmodel" > /dev/null && echo "model.mlmodel present"
          # `coremlcompiler info` is not present on every Xcode; never fail on it
          xcrun coremlcompiler info "$PKG" 2>&1 | head -80 || true
      - name: Compile with coremlcompiler
        run: |
          set -o pipefail
          xcrun coremlcompiler compile "$PKG" compiled/ 2>&1 | tee compile.log
          echo "--- compiled tree ---"
          du -sh compiled/*
          find compiled -maxdepth 2 | head -30
          echo "--- compiled weight/op stats ---"
          find compiled -name weight.bin -exec ls -l {} \;
          for m in compiled/*.mlmodelc/model.mil; do
            echo "MIL $m"
            grep -oE '^\s*[a-z_]+\(' "$m" | tr -d ' (' | sort | uniq -c | sort -rn | head -25
          done
      - name: Free disk before upload
        run: |
          rm -f pkg.zip
          rm -rf "$PKG"
          du -sh compiled
          df -h /
      - name: Upload compiled model (zip)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mlmodelc
          path: |
            compiled/
            compile.log
          retention-days: 7
