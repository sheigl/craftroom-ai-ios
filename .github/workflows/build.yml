# Path A build: unsigned device .ipa from a clean checkout.
#
# Legacy sideload path — TestFlight (testflight.yml) is the delivery route.
# Since ITMS-90558 the models are NOT bundled (4 GB thinned-bundle cap): the
# app downloads them on first launch per Resources/device/device_manifest.json
# (committed; produced by scripts/publish_device_payload.py). Only the small
# bins ride in the ipa, so no payload fetch or cache is needed here anymore.
#
# The app is built for a real device (arm64 iphoneos) WITHOUT signing;
# Sideloadly/AltStore re-signs the unsigned .app with the free Apple ID on
# the Mac. See docs/SIDELOAD.md.
name: build-unsigned-ipa

on:
  workflow_dispatch:

jobs:
  ipa:
    # arm64 macOS runner with the full Xcode toolchain. Pin when the
    # default image starts drifting (see README "runner pinning").
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # A silently-defaulted Info.plist shipped once (v0.2.0 read 1.0 (1), no
      # UIFileSharingEnabled, iPhone+iPad family): the app ran, but Documents/
      # was unreachable from Files and the build id lied. Print what XcodeGen
      # wrote and fail here, not on the iPad.
      - name: Verify generated Info.plist
        run: |
          set -euo pipefail
          echo "--- Support/Info.plist ---"
          /usr/libexec/PlistBuddy -c Print Support/Info.plist
          echo "--- project settings that must reach it ---"
          grep -E "MARKETING_VERSION|INFOPLIST_FILE|TARGETED_DEVICE_FAMILY" \
            CraftRoomAI.xcodeproj/project.pbxproj | sort -u || true
          if ! /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" Support/Info.plist; then
            echo "::warning::XcodeGen did not emit UIFileSharingEnabled — the packaging step repairs it"
          fi

      - name: Build (unsigned, arm64 device)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project CraftRoomAI.xcodeproj \
            -scheme CraftRoomAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          app=$(find build -type d -name 'CraftRoomAI.app' | head -n 1)
          test -n "$app"
          VERSION=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)
          BUILD=$(awk -F'"' '/CURRENT_PROJECT_VERSION/{print $2; exit}' project.yml)
          echo "target version: $VERSION ($BUILD)"
          # Repair, then assert. The bundle is unsigned here (Sideloadly signs
          # it later), so editing the built plist is safe — and it makes the
          # shipped identity and the Files-folder exposure deterministic even
          # if XcodeGen's info block silently fails to apply.
          PB=/usr/libexec/PlistBuddy
          # Add-or-set: PlistBuddy's `Set` fails on a key that is absent, which
          # is exactly the state a dropped `properties` block leaves behind.
          set_str() {
            $PB -c "Set :$1 $2" "$3" 2>/dev/null \
              || $PB -c "Add :$1 string $2" "$3"
          }
          set_bool() {
            $PB -c "Set :$1 $2" "$3" 2>/dev/null \
              || $PB -c "Add :$1 bool $2" "$3"
          }
          set_bool UIFileSharingEnabled true "$app/Info.plist"
          set_bool LSSupportsOpeningDocumentsInPlace true "$app/Info.plist"
          set_str CFBundleShortVersionString "$VERSION" "$app/Info.plist"
          set_str CFBundleVersion "$BUILD" "$app/Info.plist"
          set_str CFBundleDisplayName "Craft Room AI" "$app/Info.plist"
          echo "--- built app Info.plist (key subset) ---"
          for key in CFBundleShortVersionString CFBundleVersion CFBundleDisplayName \
                     UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            printf '%-32s = %s\n' "$key" "$($PB -c "Print :$key" "$app/Info.plist")"
          done
          # Hard gate: a wrong plist already cost a device round-trip.
          test "$($PB -c "Print :CFBundleShortVersionString" "$app/Info.plist")" = "$VERSION"
          test "$($PB -c "Print :CFBundleVersion" "$app/Info.plist")" = "$BUILD"
          test "$($PB -c "Print :UIFileSharingEnabled" "$app/Info.plist")" = "true"
          test "$($PB -c "Print :LSSupportsOpeningDocumentsInPlace" "$app/Info.plist")" = "true"
          mkdir -p Payload
          # NOTE: ditto SRC DST copies SRC's CONTENTS into an existing DST —
          # the app bundle must be spelled out, or the ipa ships a flattened
          # Payload/ with no .app dir and installd rejects it.
          ditto "$app" Payload/CraftRoomAI.app
          zip -qry CraftRoomAI-unsigned.ipa Payload
          ls -lh CraftRoomAI-unsigned.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: CraftRoomAI-unsigned-ipa
          path: CraftRoomAI-unsigned.ipa
          retention-days: 1
