# xcodegen project definition — CI runs `xcodegen generate` on the xcode-27 runner.
# The 3:2 VAE encoder export (vae_encoder_land_1248x832.mlpackage) and the other
# models + bins are NOT in git; CI fetches them into Resources/ before generating.
name: CraftRoomAI
options:
  bundleIdPrefix: com.sheigl
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "2"          # iPad
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  CraftRoomAI:
    type: application
    platform: iOS
    sources:
      - path: Sources/CraftRoomAI
      - path: Resources/models
        buildPhase: resources
      - path: Resources/bins
        buildPhase: resources
    info:
      path: Support/Info.plist
      # NOTE: the key is `properties`, not `props`. `props` parses as an
      # unknown key and is silently dropped, which is why every build up to
      # 0.3.0 shipped XcodeGen's bare default plist: version 1.0 (1), no
      # display name, no UIFileSharingEnabled (no Documents folder in Files),
      # no launch screen or orientations (two build warnings).
      properties:
        CFBundleDisplayName: Craft Room AI
        # Resolved from the build settings above, so the header on the iPad
        # matches the tag that was built.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Craft Room AI reads one photo you pick, to turn it into a coloring page. Everything stays on this iPad."
        # TestFlight/App Store: the app ships no cryptography, so declare it
        # here. Without this key App Store Connect holds the build at
        # "Missing Compliance" until someone answers the export question in
        # the UI — and it cannot be added after signing.
        ITSAppUsesNonExemptEncryption: false
        # Diagnostics reachability (Diagnostics.swift writes Documents/phaseA.log):
        # on-device runs have no console, and a jetsam kill leaves no crash
        # report, so the log must be pullable from Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
